name: Build and publish IG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SUSHI and Jekyll
        run: |
          npm install -g fsh-sushi
          sudo gem install jekyll --no-document

      - name: Run IG Publisher
        run: |
          mkdir -p input-cache
          curl -sL https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar
          java -jar input-cache/publisher.jar -ig .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
