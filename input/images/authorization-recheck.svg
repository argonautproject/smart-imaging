<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">DICOMweb requests an access decision before retrieval</title><desc id="desc">The client queries Imaging FHIR hosted in an imaging study service and requests images from a separate DICOMweb service. DICOMweb asks the policy-owning system for an access decision about the original caller and study before reading the image archive. The callback can use an authorized ImagingStudy query or a deployment-specific decision API. Token issuance and clinical FHIR access are omitted.</desc><defs><marker id="client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#334155"/></marker><marker id="internal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a06b20"/></marker></defs><rect width="960" height="400" fill="#f8fafc"/><rect x="280" y="20" width="645" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="305" y="51" font-size="22" fill="#172b45" font-weight="650" text-anchor="start">Imaging study service</text><rect x="305" y="75" width="280" height="65" rx="10" fill="#f0fdfa" stroke="#68b6ad" stroke-width="1.5"/><text x="320" y="102" font-size="18" fill="#0f766e" font-weight="650" text-anchor="start">Imaging FHIR Server</text><text x="320" y="126" font-size="16" fill="#526175" font-weight="400" text-anchor="start">Filter study results</text><rect x="635" y="75" width="265" height="65" rx="10" fill="#fffbeb" stroke="#e7b656" stroke-width="1.5"/><text x="650" y="102" font-size="18" fill="#92400e" font-weight="650" text-anchor="start">Study-release policy</text><text x="650" y="125" font-size="16" fill="#172b45" font-weight="400" text-anchor="start">Evaluate caller’s permissions</text><path d="M585 107 H635" fill="none" stroke="#a06b20" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#internal)" marker-start="url(#internal)"/><rect x="280" y="235" width="400" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="305" y="266" font-size="22" fill="#172b45" font-weight="650" text-anchor="start">Retrieval service</text><rect x="305" y="280" width="350" height="70" rx="10" fill="#f0fdfa" stroke="#68b6ad" stroke-width="1.5"/><text x="320" y="307" font-size="18" fill="#0f766e" font-weight="650" text-anchor="start">DICOMweb Server</text><text x="320" y="331" font-size="16" fill="#526175" font-weight="400" text-anchor="start">Check permission before release</text><rect x="20" y="170" width="150" height="90" rx="10" fill="#eff6ff" stroke="#93b4f5" stroke-width="1.5"/><text x="95" y="207" font-size="18" fill="#2563eb" font-weight="650" text-anchor="middle">SMART client</text><text x="95" y="235" font-size="15" fill="#526175" font-weight="400" text-anchor="middle">Has access token</text><rect x="745" y="280" width="180" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="835.0" y="309" font-size="20" fill="#172b45" font-weight="650" text-anchor="middle">Image archive</text><text x="835.0" y="331" font-size="14" fill="#526175" font-weight="400" text-anchor="middle">e.g., PACS</text><path d="M170 193 H220 V108 H305" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#client)" marker-start="url(#client)"/><text x="24" y="83" font-size="16" fill="#172b45" font-weight="400" text-anchor="start">Find permitted studies</text><text x="24" y="106" font-size="16" fill="#172b45" font-weight="400" text-anchor="start"></text><path d="M170 237 H220 V315 H305" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#client)"/><text x="24" y="306" font-size="16" fill="#172b45" font-weight="400" text-anchor="start">Retrieve with token</text><text x="24" y="330" font-size="16" fill="#526175" font-weight="400" text-anchor="start"></text><path d="M655 315 H745" fill="none" stroke="#a06b20" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#internal)"/><text x="685" y="299" font-size="15" fill="#526175" font-weight="400" text-anchor="start">Read</text><path d="M555 280 V202 H768 V140" fill="none" stroke="#a06b20" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#internal)" marker-start="url(#internal)"/><text x="570" y="190" font-size="16" fill="#92400e" font-weight="650" text-anchor="start">Access decision</text></svg>
