<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1230" width="400" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">SMART Imaging Access as an exchange building block</title><desc id="desc">Clinical FHIR, Imaging FHIR, and every WADO-RS request use the same existing SMART access token within a health system, with additional integration for direct partner connections, a shared exchange service, or interconnected networks. Lines represent relationships, not token flows.</desc><rect x="10" y="10" width="380" height="330" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="200" y="43" font-size="21" fill="#1f2430" font-weight="600" text-anchor="middle">Within a health system</text><rect x="30" y="64" width="340" height="48" rx="10" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.5"/><text x="200" y="94" font-size="18" fill="#1d4ed8" font-weight="600" text-anchor="middle">Shared SMART access token</text><rect x="50" y="131" width="300" height="56" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="200" y="154" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">Clinical FHIR</text><text x="200" y="175" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Clinical records</text><rect x="50" y="197" width="300" height="56" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="200" y="220" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">Imaging FHIR</text><text x="200" y="241" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Study metadata</text><rect x="50" y="263" width="300" height="56" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="200" y="286" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">DICOMweb</text><text x="200" y="307" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Image retrieval</text><path d="M200,340 L200,364" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="20" y="364" width="360" height="86" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 5"/><text x="200" y="392" font-size="18" fill="#1f2430" font-weight="600" text-anchor="middle">Additional network integration</text><text x="200" y="416" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Trust · authorization · patient matching</text><text x="200" y="438" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Record location</text><text x="200" y="482" font-size="18" fill="#1f2430" font-weight="600" text-anchor="middle">Possible exchange arrangements</text><rect x="70" y="502" width="260" height="222" rx="10" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="200" y="532" font-size="16" fill="#1f2430" font-weight="600" text-anchor="middle">Direct partners</text><path d="M128,592 L272,592" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M128,592 L200,668" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M272,592 L200,668" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="102" y="574" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="128" y="597" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">A</text><rect x="246" y="574" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="272" y="597" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">B</text><rect x="174" y="650" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="200" y="673" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">C</text><rect x="70" y="734" width="260" height="222" rx="10" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="200" y="764" font-size="16" fill="#1f2430" font-weight="600" text-anchor="middle">Shared exchange service</text><path d="M200,859 L118,817" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M200,859 L282,817" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M200,859 L200,912" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="148" y="837" width="104" height="40" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="200" y="862" font-size="14" fill="#1f2430" font-weight="400" text-anchor="middle">Exchange</text><rect x="92" y="799" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="118" y="822" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">A</text><rect x="256" y="799" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="282" y="822" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">B</text><rect x="174" y="894" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="200" y="917" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">C</text><rect x="70" y="966" width="260" height="222" rx="10" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="200" y="996" font-size="16" fill="#1f2430" font-weight="600" text-anchor="middle">Interconnected networks</text><path d="M137,1091 L263,1091" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M137,1046 L137,1136" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="89" y="1070" width="96" height="42" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="137" y="1096" font-size="14" fill="#1f2430" font-weight="400" text-anchor="middle">Network</text><path d="M263,1046 L263,1136" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="215" y="1070" width="96" height="42" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="263" y="1096" font-size="14" fill="#1f2430" font-weight="400" text-anchor="middle">Network</text><rect x="111" y="1018" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="137" y="1041" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">A</text><rect x="237" y="1018" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="263" y="1041" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">B</text><rect x="111" y="1128" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="137" y="1151" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">C</text><rect x="237" y="1128" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="263" y="1151" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">D</text><text x="200" y="1214" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">A–D: health systems; separate authorization.</text></svg>
