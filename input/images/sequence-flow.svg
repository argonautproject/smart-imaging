<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 892" width="860" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The client presents the same existing SMART access token on every FHIR and WADO-RS request. Sequence diagram: the App discovers the imaging endpoint, authorizes with the Authorization Server, and optionally fetches clinical data. The collective Imaging Server contains Imaging FHIR Server for ImagingStudy and Endpoint resources and DICOMweb Server for WADO-RS retrieval. For study search, Imaging FHIR Server introspects the token with the Authorization Server, then applies study-access policy before returning authorized studies and endpoints. For image retrieval, DICOMweb Server introspects the token, then authorizes the requested study before returning authorized images. The resource servers enforce study-access decisions after token validation.">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4453"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a1"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Phase bands -->
  <g>
    <rect x="36" y="114" width="858" height="214" rx="8" fill="#f4f6f9"/>
    <rect x="36" y="340" width="858" height="84" rx="8" fill="#f4f6f9"/>
    <rect x="36" y="436" width="858" height="204" rx="8" fill="#f4f6f9"/>
    <rect x="36" y="652" width="858" height="204" rx="8" fill="#f4f6f9"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#5b6472" letter-spacing="0.06em">
    <text x="48" y="136">AUTHORIZE — SMART APP LAUNCH</text>
    <text x="48" y="362">CLINICAL DATA (OPTIONAL)</text>
    <text x="48" y="458">FIND STUDIES</text>
    <text x="48" y="674">FETCH IMAGES</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#c9cfd8" stroke-width="1.2" stroke-dasharray="3,5">
    <line x1="110" y1="82" x2="110" y2="872"/>
    <line x1="330" y1="82" x2="330" y2="872"/>
    <line x1="520" y1="82" x2="520" y2="872"/>
    <line x1="695" y1="82" x2="695" y2="872"/>
    <line x1="835" y1="82" x2="835" y2="872"/>
  </g>

  <!-- Participant headers -->
  <rect x="60" y="22" width="100" height="46" rx="7" fill="#fffaf0" stroke="#d97706" stroke-width="1.4"/>
  <text x="110" y="44" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">App</text>
  <text x="110" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">SMART client</text>

  <rect x="245" y="22" width="170" height="46" rx="7" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="330" y="44" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Authorization Server</text>
  <text x="330" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">authorize · token · introspect</text>

  <rect x="440" y="22" width="160" height="46" rx="7" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="520" y="44" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Clinical FHIR Server</text>
  <text x="520" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">clinical data</text>

  <!-- Nested interfaces within the collective Imaging Server role -->
  <rect x="615" y="4" width="280" height="92" rx="9" fill="#f0faf8" stroke="#b2ddd5"/>
  <text x="755" y="21" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">Imaging Server</text>
  <rect x="622" y="32" width="146" height="50" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="695" y="46" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Imaging FHIR</text>
  <text x="695" y="60" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Server</text>
  <text x="695" y="75" font-size="10" fill="#5b6472" text-anchor="middle">ImagingStudy + Endpoint</text>
  <rect x="775" y="32" width="120" height="50" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="835" y="46" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">DICOMweb</text>
  <text x="835" y="60" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Server</text>
  <text x="835" y="75" font-size="10" fill="#5b6472" text-anchor="middle">WADO-RS retrieval</text>

  <!-- Messages -->
  <g fill="none">
    <!-- Phase 1 -->
    <line x1="112" y1="164" x2="514" y2="164" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="518" y1="190" x2="116" y2="190" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <line x1="112" y1="226" x2="324" y2="226" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="326" y1="252" x2="116" y2="252" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <line x1="112" y1="282" x2="324" y2="282" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="326" y1="308" x2="116" y2="308" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <!-- Phase 2 -->
    <line x1="112" y1="382" x2="514" y2="382" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="518" y1="408" x2="116" y2="408" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <!-- Phase 3 -->
    <line x1="112" y1="478" x2="689" y2="478" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="691" y1="506" x2="336" y2="506" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="336" y1="530" x2="689" y2="530" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="691" y1="618" x2="116" y2="618" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <!-- Phase 4 -->
    <line x1="112" y1="694" x2="829" y2="694" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="831" y1="720" x2="336" y2="720" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="336" y1="744" x2="829" y2="744" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="831" y1="838" x2="116" y2="838" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
  </g>

  <!-- Resource-server policy actions after introspection and before results -->
  <rect x="599" y="548" width="192" height="32" rx="7" fill="#f0faf8" stroke="#0d9488" stroke-width="1.4"/>
  <text x="695" y="568" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">Apply study-access policy</text>
  <rect x="710" y="762" width="180" height="32" rx="7" fill="#f0faf8" stroke="#0d9488" stroke-width="1.4"/>
  <text x="800" y="782" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">Authorize requested study</text>

  <text x="465" y="322" font-size="11" fill="#5b6472" text-anchor="middle">Same SMART token on every FHIR and WADO-RS request</text>

  <!-- Message labels -->
  <g font-size="11.5" fill="#1f2430" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">
    <text x="315" y="157"><tspan font-weight="700" fill="#2563eb">1 · </tspan>GET …/.well-known/smart-configuration</text>
    <text x="315" y="183" fill="#5b6472">imaging endpoint + authorization URLs</text>
    <text x="220" y="219"><tspan font-weight="700" fill="#2563eb">2 · </tspan>authorize — user approves sharing</text>
    <text x="220" y="245" fill="#5b6472">authorization code</text>
    <text x="220" y="275"><tspan font-weight="700" fill="#2563eb">3 · </tspan>POST /token</text>
    <text x="220" y="301" fill="#5b6472">access token + patient context</text>
    <text x="315" y="375"><tspan font-weight="700" fill="#2563eb">4 · </tspan>GET Patient/123</text>
    <text x="315" y="401" fill="#5b6472">Patient resource (identifiers incl. MRN)</text>
    <text x="402" y="471"><tspan font-weight="700" fill="#0d9488">5 · </tspan>GET ImagingStudy?patient=123&amp;_include=ImagingStudy:endpoint</text>
    <text x="512" y="499" fill="#6d28d9" font-size="11">introspect token</text>
    <text x="512" y="523" fill="#6d28d9" font-size="11">active · patient 123 · imaging scopes</text>
    <text x="402" y="611" fill="#5b6472">Authorized studies: Bundle of ImagingStudy + WADO-RS Endpoints</text>
    <text x="472" y="687"><tspan font-weight="700" fill="#0d9488">6 · </tspan>GET {address}/studies/{Study Instance UID}</text>
    <text x="582" y="713" fill="#6d28d9" font-size="11">introspect token</text>
    <text x="582" y="737" fill="#6d28d9" font-size="11">active · patient 123 · imaging scopes</text>
    <text x="472" y="831" fill="#5b6472">Authorized images: DICOM instances — multipart/related; type=application/dicom</text>
  </g>
</svg>
