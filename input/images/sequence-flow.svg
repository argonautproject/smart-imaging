<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 750" width="860" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sequence diagram: the app discovers the imaging endpoint, authorizes with the organization's authorization server, optionally fetches clinical data, searches ImagingStudy on the imaging FHIR endpoint, and retrieves DICOM data from WADO-RS; the imaging endpoints validate the token via introspection">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4453"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a1"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Phase bands -->
  <g>
    <rect x="36" y="84" width="858" height="214" rx="8" fill="#f4f6f9"/>
    <rect x="36" y="310" width="858" height="84" rx="8" fill="#f4f6f9"/>
    <rect x="36" y="406" width="858" height="148" rx="8" fill="#f4f6f9"/>
    <rect x="36" y="566" width="858" height="148" rx="8" fill="#f4f6f9"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#5b6472" letter-spacing="0.06em">
    <text x="48" y="106">AUTHORIZE — SMART APP LAUNCH</text>
    <text x="48" y="332">CLINICAL DATA (OPTIONAL)</text>
    <text x="48" y="428">FIND STUDIES</text>
    <text x="48" y="588">FETCH IMAGES</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#c9cfd8" stroke-width="1.2" stroke-dasharray="3,5">
    <line x1="110" y1="68" x2="110" y2="730"/>
    <line x1="330" y1="68" x2="330" y2="730"/>
    <line x1="520" y1="68" x2="520" y2="730"/>
    <line x1="695" y1="68" x2="695" y2="730"/>
    <line x1="835" y1="68" x2="835" y2="730"/>
  </g>

  <!-- Participant headers -->
  <rect x="60" y="22" width="100" height="46" rx="7" fill="#fffaf0" stroke="#d97706" stroke-width="1.4"/>
  <text x="110" y="44" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">App</text>
  <text x="110" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">SMART client</text>

  <rect x="255" y="22" width="150" height="46" rx="7" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="330" y="44" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Authorization Server</text>
  <text x="330" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">authorize · token · introspect</text>

  <rect x="450" y="22" width="140" height="46" rx="7" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="520" y="44" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Clinical FHIR</text>
  <text x="520" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">clinical data (optional)</text>

  <rect x="625" y="22" width="140" height="46" rx="7" fill="#f0faf8" stroke="#0d9488" stroke-width="1.4"/>
  <text x="695" y="44" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">Imaging FHIR</text>
  <text x="695" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">ImagingStudy</text>

  <rect x="775" y="22" width="120" height="46" rx="7" fill="#f0faf8" stroke="#0d9488" stroke-width="1.4"/>
  <text x="835" y="44" font-size="12.5" font-weight="700" fill="#1f2430" text-anchor="middle">WADO-RS</text>
  <text x="835" y="59" font-size="9.5" fill="#5b6472" text-anchor="middle">DICOM data</text>

  <!-- Messages -->
  <g fill="none">
    <!-- Phase 1 -->
    <line x1="112" y1="134" x2="514" y2="134" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="518" y1="160" x2="116" y2="160" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <line x1="112" y1="196" x2="324" y2="196" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="326" y1="222" x2="116" y2="222" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <line x1="112" y1="252" x2="324" y2="252" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="326" y1="278" x2="116" y2="278" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <!-- Phase 2 -->
    <line x1="112" y1="352" x2="514" y2="352" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="518" y1="378" x2="116" y2="378" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <!-- Phase 3 -->
    <line x1="112" y1="448" x2="689" y2="448" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="691" y1="476" x2="336" y2="476" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="336" y1="500" x2="689" y2="500" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="691" y1="532" x2="116" y2="532" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
    <!-- Phase 4 -->
    <line x1="112" y1="608" x2="829" y2="608" stroke="#3c4453" stroke-width="1.5" marker-end="url(#arrD)"/>
    <line x1="831" y1="634" x2="336" y2="634" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="336" y1="658" x2="829" y2="658" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2,3.5" marker-end="url(#arrP)"/>
    <line x1="831" y1="696" x2="116" y2="696" stroke="#8a93a1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrG)"/>
  </g>

  <!-- Message labels -->
  <g font-size="11.5" fill="#1f2430" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">
    <text x="315" y="127"><tspan font-weight="700" fill="#2563eb">1 · </tspan>GET …/.well-known/smart-configuration</text>
    <text x="315" y="153" fill="#5b6472">imaging endpoint + authorization URLs</text>
    <text x="220" y="189"><tspan font-weight="700" fill="#2563eb">2 · </tspan>authorize — user approves sharing</text>
    <text x="220" y="215" fill="#5b6472">authorization code</text>
    <text x="220" y="245"><tspan font-weight="700" fill="#2563eb">3 · </tspan>POST /token</text>
    <text x="220" y="271" fill="#5b6472">access token + patient context</text>
    <text x="315" y="345"><tspan font-weight="700" fill="#2563eb">4 · </tspan>GET Patient/123</text>
    <text x="315" y="371" fill="#5b6472">Patient resource (identifiers incl. MRN)</text>
    <text x="402" y="441"><tspan font-weight="700" fill="#0d9488">5 · </tspan>GET ImagingStudy?patient=123&amp;_include=ImagingStudy:endpoint</text>
    <text x="512" y="469" fill="#6d28d9" font-size="11">introspect token</text>
    <text x="512" y="493" fill="#6d28d9" font-size="11">active · patient 123 · imaging scopes</text>
    <text x="402" y="525" fill="#5b6472">Bundle of ImagingStudy + WADO-RS Endpoints</text>
    <text x="472" y="601"><tspan font-weight="700" fill="#0d9488">6 · </tspan>GET {address}/studies/{Study Instance UID}</text>
    <text x="582" y="627" fill="#6d28d9" font-size="11">introspect token</text>
    <text x="582" y="651" fill="#6d28d9" font-size="11">active · patient 123 · imaging scopes</text>
    <text x="472" y="689" fill="#5b6472">DICOM instances — multipart/related; type=application/dicom</text>
  </g>
</svg>
