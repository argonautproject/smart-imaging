<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The client presents the same existing SMART access token on every FHIR and WADO-RS request. The App authorizes with the Authorization Server, optionally queries the Clinical FHIR Server, and uses the collective Imaging Server role. Within Imaging Server, Imaging FHIR Server provides ImagingStudy and Endpoint resources, and DICOMweb Server provides WADO-RS retrieval. Dashed connections show token introspection with the Authorization Server, distinct from resource-server study-access policy checks.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a1"/>
    </marker>
  </defs>

  <!-- App -->
  <rect x="70" y="20" width="300" height="80" rx="10" fill="#fffaf0" stroke="#d97706" stroke-width="1.5"/>
  <text x="220" y="53" font-size="16" font-weight="700" fill="#1f2430" text-anchor="middle">App</text>
  <text x="220" y="77" font-size="11" fill="#5b6472" text-anchor="middle">patient- or provider-facing · one SMART token</text>

  <text x="220" y="120" font-size="11" fill="#5b6472" text-anchor="middle">Same SMART token for every FHIR + WADO-RS request</text>

  <!-- Authorization role, including its introspection endpoint -->
  <rect x="60" y="142" width="320" height="126" rx="10" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="76" y="169" font-size="14" font-weight="700" fill="#1d4ed8">Authorization Server</text>
  <text x="76" y="190" font-size="11" fill="#5b6472"><tspan font-weight="700" fill="#2563eb">1 · </tspan>Authorize — SMART App Launch</text>
  <text x="76" y="208" font-size="10.5" fill="#5b6472">Issues and refreshes tokens</text>
  <rect x="76" y="222" width="288" height="32" rx="7" fill="#ffffff" stroke="#c4d5f2"/>
  <text x="220" y="243" font-size="11.5" font-weight="600" fill="#1f2430" text-anchor="middle">Token introspection</text>

  <!-- Clinical data role; the request is optional -->
  <rect x="60" y="304" width="320" height="76" rx="10" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="76" y="332" font-size="14" font-weight="700" fill="#1d4ed8">Clinical FHIR Server</text>
  <text x="76" y="355" font-size="11" fill="#5b6472"><tspan font-weight="700" fill="#2563eb">2 · </tspan>Fetch clinical data (optional)</text>

  <!-- Imaging role -->
  <rect x="60" y="416" width="320" height="192" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.3"/>
  <text x="76" y="443" font-size="14" font-weight="700" fill="#0f766e">Imaging Server</text>
  <text x="76" y="462" font-size="10.5" fill="#5b6472">Study metadata and DICOM data</text>
  <rect x="76" y="480" width="288" height="48" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/>
  <text x="220" y="500" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle">Imaging FHIR Server</text>
  <text x="220" y="517" font-size="10.5" fill="#5b6472" text-anchor="middle"><tspan font-weight="700" fill="#0d9488">3 · </tspan>Find studies — ImagingStudy + Endpoint</text>
  <rect x="76" y="536" width="288" height="48" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/>
  <text x="220" y="556" font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle">DICOMweb Server</text>
  <text x="220" y="573" font-size="10.5" fill="#5b6472" text-anchor="middle"><tspan font-weight="700" fill="#0d9488">4 · </tspan>Fetch images — WADO-RS retrieval</text>

  <!-- App traffic branches to each role -->
  <path d="M70,60 H24 V560 H72" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M24,181 H56" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M24,338 H56" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M24,504 H72" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Introspection connections -->
  <path d="M364,560 H404 V238 H370" stroke="#8a93a1" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
  <path d="M364,504 H404" stroke="#8a93a1" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <text x="420" y="399" font-size="10.5" fill="#6b7280" text-anchor="middle" transform="rotate(-90 420 399)">validate token</text>
</svg>
