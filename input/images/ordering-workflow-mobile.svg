<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 880" width="340" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Imaging workflow in three steps (mobile): ordering assigns the Accession Number in the RIS; acquisition assigns the DICOM UIDs in the PACS; reporting ties the report back to the EHR by MRN and Accession Number">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <!-- Card 1: Order -->
  <rect x="30" y="20" width="300" height="256" rx="10" fill="#fbfcfe" stroke="#d7dce4"/>
  <circle cx="56" cy="50" r="12" fill="#475569"/>
  <text x="56" y="54.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="55" font-size="14" font-weight="700" fill="#1f2430">Order</text>

  <rect x="88" y="84" width="64" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="120" y="101" font-size="11" fill="#3c4453" text-anchor="middle">Clinician</text>
  <line x1="154" y1="97" x2="168" y2="97" stroke="#9aa3af" stroke-width="1.4" marker-end="url(#arrs)"/>
  <rect x="170" y="84" width="44" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="192" y="101" font-size="11" fill="#3c4453" text-anchor="middle">EHR</text>
  <line x1="216" y1="97" x2="230" y2="97" stroke="#9aa3af" stroke-width="1.4" marker-end="url(#arrs)"/>
  <rect x="232" y="84" width="40" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="252" y="101" font-size="11" fill="#3c4453" text-anchor="middle">RIS</text>

  <text x="180" y="144" font-size="10.5" fill="#8a93a1" text-anchor="middle">the RIS assigns:</text>
  <rect x="115" y="154" width="130" height="24" rx="12" fill="#fde9c8" stroke="#d97706"/>
  <text x="180" y="170" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Accession Number</text>

  <text x="180" y="210" font-size="11.5" fill="#5b6472" text-anchor="middle">The EHR stores it on the imaging</text>
  <text x="180" y="228" font-size="11.5" fill="#5b6472" text-anchor="middle">order (ServiceRequest). The patient</text>
  <text x="180" y="246" font-size="11.5" fill="#5b6472" text-anchor="middle">is identified by MRN.</text>

  <line x1="180" y1="280" x2="180" y2="306" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Card 2: Acquire -->
  <rect x="30" y="310" width="300" height="256" rx="10" fill="#fbfcfe" stroke="#d7dce4"/>
  <circle cx="56" cy="340" r="12" fill="#475569"/>
  <text x="56" y="344.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="345" font-size="14" font-weight="700" fill="#1f2430">Acquire</text>

  <rect x="110" y="374" width="70" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="145" y="391" font-size="11" fill="#3c4453" text-anchor="middle">Modality</text>
  <line x1="182" y1="387" x2="196" y2="387" stroke="#9aa3af" stroke-width="1.4" marker-end="url(#arrs)"/>
  <rect x="198" y="374" width="52" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="224" y="391" font-size="11" fill="#3c4453" text-anchor="middle">PACS</text>

  <text x="180" y="426" font-size="10.5" fill="#8a93a1" text-anchor="middle">new identifiers, assigned with the images:</text>
  <rect x="110" y="434" width="140" height="24" rx="12" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="180" y="450" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">Study Instance UID</text>
  <rect x="105" y="464" width="150" height="24" rx="12" fill="#e6faf6" stroke="#5eead4"/>
  <text x="180" y="480" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">Series Instance UIDs</text>
  <rect x="110" y="494" width="140" height="24" rx="12" fill="#e6faf6" stroke="#5eead4"/>
  <text x="180" y="510" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">SOP Instance UIDs</text>

  <text x="180" y="538" font-size="11.5" fill="#5b6472" text-anchor="middle">DICOM headers also carry the</text>
  <text x="180" y="556" font-size="11.5" fill="#5b6472" text-anchor="middle">patient's MRN + Accession Number.</text>

  <line x1="180" y1="570" x2="180" y2="596" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Card 3: Report -->
  <rect x="30" y="600" width="300" height="256" rx="10" fill="#fbfcfe" stroke="#d7dce4"/>
  <circle cx="56" cy="630" r="12" fill="#475569"/>
  <text x="56" y="634.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="76" y="635" font-size="14" font-weight="700" fill="#1f2430">Report</text>

  <rect x="81" y="664" width="78" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="120" y="681" font-size="11" fill="#3c4453" text-anchor="middle">Radiologist</text>
  <line x1="161" y1="677" x2="175" y2="677" stroke="#9aa3af" stroke-width="1.4" marker-end="url(#arrs)"/>
  <rect x="177" y="664" width="40" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="197" y="681" font-size="11" fill="#3c4453" text-anchor="middle">RIS</text>
  <line x1="219" y1="677" x2="233" y2="677" stroke="#9aa3af" stroke-width="1.4" marker-end="url(#arrs)"/>
  <rect x="235" y="664" width="44" height="26" rx="6" fill="#ffffff" stroke="#9aa3af"/>
  <text x="257" y="681" font-size="11" fill="#3c4453" text-anchor="middle">EHR</text>

  <text x="180" y="724" font-size="10.5" fill="#8a93a1" text-anchor="middle">the report is keyed by:</text>
  <rect x="84" y="734" width="52" height="24" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="110" y="750" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">MRN</text>
  <rect x="146" y="734" width="130" height="24" rx="12" fill="#fde9c8" stroke="#d97706"/>
  <text x="211" y="750" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Accession Number</text>

  <text x="180" y="790" font-size="11.5" fill="#5b6472" text-anchor="middle">It lands in the EHR as a</text>
  <text x="180" y="808" font-size="11.5" fill="#5b6472" text-anchor="middle">DiagnosticReport — ideally carrying</text>
  <text x="180" y="826" font-size="11.5" fill="#5b6472" text-anchor="middle">the Study Instance UID.</text>
</svg>
