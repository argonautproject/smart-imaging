<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">The gateway evaluates policy and controls retrieval</title><desc id="desc">The client presents the same existing SMART access token on every FHIR and WADO-RS request. A gateway hosts Imaging FHIR and DICOMweb. Both interfaces consult the gateway study-access policy using validated token context and configured rules. DICOMweb reads only authorized images from an internal image archive, such as a PACS. Token issuance and clinical FHIR access are omitted.</desc><defs><marker id="client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#334155"/></marker><marker id="internal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a06b20"/></marker></defs><rect width="960" height="400" fill="#f8fafc"/><rect x="250" y="25" width="540" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="275" y="58" font-size="22" fill="#172b45" font-weight="650" text-anchor="start">Gateway</text><rect x="275" y="90" width="240" height="65" rx="10" fill="#f0fdfa" stroke="#68b6ad" stroke-width="1.5"/><text x="290" y="117" font-size="18" fill="#0f766e" font-weight="650" text-anchor="start">Imaging FHIR Server</text><text x="290" y="141" font-size="16" fill="#526175" font-weight="400" text-anchor="start">Filter study results</text><rect x="275" y="250" width="240" height="65" rx="10" fill="#f0fdfa" stroke="#68b6ad" stroke-width="1.5"/><text x="290" y="277" font-size="18" fill="#0f766e" font-weight="650" text-anchor="start">DICOMweb Server</text><text x="290" y="301" font-size="16" fill="#526175" font-weight="400" text-anchor="start">Authorize retrieval</text><rect x="565" y="155" width="200" height="100" rx="10" fill="#fffbeb" stroke="#e7b656" stroke-width="1.5"/><text x="580" y="184" font-size="18" fill="#92400e" font-weight="650" text-anchor="start">Access policy</text><text x="580" y="211" font-size="16" fill="#172b45" font-weight="400" text-anchor="start">Token context +</text><text x="580" y="234" font-size="16" fill="#172b45" font-weight="400" text-anchor="start">configured rules</text><rect x="20" y="170" width="150" height="90" rx="10" fill="#eff6ff" stroke="#93b4f5" stroke-width="1.5"/><text x="95" y="207" font-size="18" fill="#2563eb" font-weight="650" text-anchor="middle">SMART client</text><text x="95" y="235" font-size="15" fill="#526175" font-weight="400" text-anchor="middle">Has access token</text><rect x="825" y="250" width="115" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="882.5" y="279" font-size="20" fill="#172b45" font-weight="650" text-anchor="middle">Archive</text><text x="882.5" y="301" font-size="14" fill="#526175" font-weight="400" text-anchor="middle">e.g., PACS</text><path d="M170 193 H215 V122 H275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#client)" marker-start="url(#client)"/><text x="24" y="108" font-size="16" fill="#172b45" font-weight="400" text-anchor="start">Find permitted studies</text><text x="24" y="131" font-size="16" fill="#526175" font-weight="400" text-anchor="start">with SMART token</text><path d="M170 237 H215 V283 H275" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#client)"/><text x="24" y="308" font-size="16" fill="#172b45" font-weight="400" text-anchor="start">Retrieve images</text><text x="24" y="332" font-size="16" fill="#526175" font-weight="400" text-anchor="start">with SMART token</text><path d="M515 122 H665 V155" fill="none" stroke="#a06b20" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#internal)" marker-start="url(#internal)"/><path d="M515 283 H665 V255" fill="none" stroke="#a06b20" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#internal)" marker-start="url(#internal)"/><path d="M515 300 H815" fill="none" stroke="#a06b20" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#internal)"/><text x="595" y="325" font-size="16" fill="#526175" font-weight="400" text-anchor="start">Read images</text></svg>
