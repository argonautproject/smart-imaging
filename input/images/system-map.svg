<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="760" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="An App authorizes with the Authorization Server, optionally queries the Clinical FHIR Server, and uses the Imaging Server for study metadata and DICOM data. The three server roles are shown separately; the Imaging Server validates tokens through the Authorization Server's introspection endpoint.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a1"/>
    </marker>
  </defs>

  <!-- Authorization role, including its introspection endpoint -->
  <rect x="450" y="30" width="380" height="118" rx="10" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="470" y="57" font-size="15" font-weight="700" fill="#1d4ed8">Authorization Server</text>
  <text x="470" y="77" font-size="11.5" fill="#5b6472">SMART App Launch · token issuance and refresh</text>
  <rect x="470" y="96" width="340" height="36" rx="7" fill="#ffffff" stroke="#c4d5f2"/>
  <text x="640" y="119" font-size="12" font-weight="600" fill="#1f2430" text-anchor="middle">Token introspection</text>

  <!-- Clinical data role -->
  <rect x="450" y="182" width="380" height="74" rx="10" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="470" y="211" font-size="15" font-weight="700" fill="#1d4ed8">Clinical FHIR Server</text>
  <text x="470" y="233" font-size="11.5" fill="#5b6472">Patient · DiagnosticReport · ServiceRequest · …</text>

  <!-- Imaging role, with its two data interfaces -->
  <rect x="450" y="300" width="380" height="180" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.3"/>
  <text x="470" y="328" font-size="15" font-weight="700" fill="#0f766e">Imaging Server</text>
  <text x="470" y="346" font-size="11.5" fill="#5b6472">study metadata and DICOM data</text>
  <rect x="470" y="360" width="340" height="48" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/>
  <text x="640" y="380" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle">ImagingStudy FHIR endpoint</text>
  <text x="640" y="396" font-size="10.5" fill="#5b6472" text-anchor="middle">GET /ImagingStudy?patient=…</text>
  <rect x="470" y="416" width="340" height="48" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/>
  <text x="640" y="436" font-size="13" font-weight="600" fill="#1f2430" text-anchor="middle">WADO-RS endpoint</text>
  <text x="640" y="452" font-size="10.5" fill="#5b6472" text-anchor="middle">GET /studies/{uid} → DICOM</text>

  <!-- App -->
  <rect x="30" y="170" width="195" height="126" rx="10" fill="#fffaf0" stroke="#d97706" stroke-width="1.5"/>
  <text x="127.5" y="214" font-size="17" font-weight="700" fill="#1f2430" text-anchor="middle">App</text>
  <text x="127.5" y="240" font-size="11.5" fill="#5b6472" text-anchor="middle">patient- or provider-facing</text>
  <text x="127.5" y="259" font-size="11.5" fill="#5b6472" text-anchor="middle">holds one SMART access token</text>

  <!-- App requests -->
  <path d="M225,190 L446,64" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M225,216 L446,219" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M225,245 L466,384" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M225,276 L466,440" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- Introspection connections -->
  <path d="M810,440 H848 V114 H816" stroke="#8a93a1" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
  <path d="M810,384 H848" stroke="#8a93a1" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <text x="866" y="273" font-size="11" fill="#6b7280" text-anchor="middle" transform="rotate(-90 866 273)">validate token</text>

  <!-- Request labels; only the clinical-data request is optional -->
  <g font-size="12.5" font-weight="600" fill="#1f2430" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="335" y="113"><tspan font-weight="700" fill="#2563eb">1 · </tspan>Authorize</text>
    <text x="335" y="204"><tspan font-weight="700" fill="#2563eb">2 · </tspan>Clinical data (optional)</text>
    <text x="335" y="302"><tspan font-weight="700" fill="#0d9488">3 · </tspan>Find studies</text>
    <text x="335" y="347"><tspan font-weight="700" fill="#0d9488">4 · </tspan>Fetch images</text>
  </g>
</svg>
