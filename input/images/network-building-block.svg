<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">SMART Imaging Access as an exchange building block</title><desc id="desc">Clinical FHIR, Imaging FHIR, and every WADO-RS request use the same existing SMART access token within a health system, with additional integration for direct partner connections, a shared exchange service, or interconnected networks. Lines represent relationships, not token flows.</desc><rect x="80" y="20" width="740" height="232" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="450" y="52" font-size="21" fill="#1f2430" font-weight="600" text-anchor="middle">Within a health system</text><rect x="110" y="72" width="680" height="48" rx="10" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="102" font-size="18" fill="#1d4ed8" font-weight="600" text-anchor="middle">Shared SMART access token</text><path d="M218,120 L218,145" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="110" y="145" width="216" height="80" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="218" y="175" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">Clinical FHIR</text><text x="218" y="201" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Clinical records</text><path d="M450,120 L450,145" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="342" y="145" width="216" height="80" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="450" y="175" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">Imaging FHIR</text><text x="450" y="201" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Study metadata</text><path d="M682,120 L682,145" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="574" y="145" width="216" height="80" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="682" y="175" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">DICOMweb</text><text x="682" y="201" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Image retrieval</text><path d="M450,252 L450,280" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="170" y="280" width="560" height="66" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 5"/><text x="450" y="307" font-size="18" fill="#1f2430" font-weight="600" text-anchor="middle">Additional network integration</text><text x="450" y="331" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">Trust · authorization · patient matching · record location</text><path d="M450,346 L160,410" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="30" y="410" width="260" height="222" rx="10" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="160" y="440" font-size="16" fill="#1f2430" font-weight="600" text-anchor="middle">Direct partners</text><path d="M88,500 L232,500" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M88,500 L160,576" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M232,500 L160,576" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="62" y="482" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="88" y="505" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">A</text><rect x="206" y="482" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="232" y="505" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">B</text><rect x="134" y="558" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="160" y="581" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">C</text><path d="M450,346 L450,410" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="320" y="410" width="260" height="222" rx="10" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="450" y="440" font-size="16" fill="#1f2430" font-weight="600" text-anchor="middle">Shared exchange service</text><path d="M450,535 L368,493" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M450,535 L532,493" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M450,535 L450,588" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="398" y="513" width="104" height="40" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="450" y="538" font-size="14" fill="#1f2430" font-weight="400" text-anchor="middle">Exchange</text><rect x="342" y="475" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="368" y="498" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">A</text><rect x="506" y="475" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="532" y="498" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">B</text><rect x="424" y="570" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="450" y="593" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">C</text><path d="M450,346 L740,410" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="610" y="410" width="260" height="222" rx="10" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="740" y="440" font-size="16" fill="#1f2430" font-weight="600" text-anchor="middle">Interconnected networks</text><path d="M677,535 L803,535" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M677,490 L677,580" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="629" y="514" width="96" height="42" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="677" y="540" font-size="14" fill="#1f2430" font-weight="400" text-anchor="middle">Network</text><path d="M803,490 L803,580" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="755" y="514" width="96" height="42" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="803" y="540" font-size="14" fill="#1f2430" font-weight="400" text-anchor="middle">Network</text><rect x="651" y="462" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="677" y="485" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">A</text><rect x="777" y="462" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="803" y="485" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">B</text><rect x="651" y="572" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="677" y="595" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">C</text><rect x="777" y="572" width="52" height="36" rx="10" fill="#f0faf8" stroke="#0d9488" stroke-width="1.5"/><text x="803" y="595" font-size="14" fill="#0f766e" font-weight="600" text-anchor="middle">D</text><text x="450" y="660" font-size="15" fill="#1f2430" font-weight="400" text-anchor="middle">A–D represent health systems, each with its own authorization boundary.</text><text x="450" y="686" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">Connections show relationships, not token flows.</text></svg>
